<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1Z26 Cipher</title>
    <script src="../../Controllers/MonoalphabeticSubstitutionCipherControllers/CharacterToNumberController.js" type="module" defer></script>
    <link rel="stylesheet" href="../../Stylesheets/Main.css">
</head>
<body>
    <h1 id="header"></h1>
    <a href="../../Index.html"><< Home</a>
    <div class="container">
        <details class="row">
            <summary>Optional settings</summary>
            <div class="row">
                 <div class="label">Character set to use:</div>
                <div>
                    <textarea id="txtCharSet">ABCDEFGHIJKLMNOPQRSTUVWXYZ</textarea>
                </div>
            </div>
            <div class="row">
                <div class="label">Seperator character:</div>
                <div>
                    <input type="text" maxlength="1" id="inpSeperator" value="0">
                    <abbr title="Character that will be used to represent spaces in a numerical text"></abbr>
                </div>
            </div>
            <div class="row">
                <div class="label">Value for first character:</div>
                <div>
                    <input type="number" id="inpFirstCharValue" value="1">
                </div>
            </div>
        </details>
        <div class="row">
            <div class="label">Plaintext:</div>
            <div>
                <textarea id="txtPlaintext"></textarea>
            </div>
        </div>
        <div class="row">
            <div class="label">Encrypted:</div>
            <div>
                <textarea id="txtCiphertext"></textarea>
            </div>
        </div>
    </div>
</body>
</html>
