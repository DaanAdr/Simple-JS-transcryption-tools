<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shift Cipher</title>
    <script src="../../Controllers/MonoalphabeticSubstitutionCipherControllers/ChaocipherController.js" type="module" defer></script>
    <link rel="stylesheet" href="../../Stylesheets/Main.css">
</head>
<body>
    <h1>Chaocipher</h1>
    <a href="../../Index.html"><< Home</a>
    <div class="container">
        <details class="row">
            <summary>Optional settings</summary>
            <div class="row">
                 <div class="label">Character set to use for plain text:</div>
                <div>
                    <textarea id="txtPlaintextCharacterSet">ABCDEFGHIJKLMNOPQRSTUVWXYZ</textarea>
                    <abbr title="Use space to create a second set of character on which the shift gets applied independently.">(?)</abbr>
                </div>
            </div>
            <div class="row">
                 <div class="label">Character set to use for cipher text:</div>
                <div>
                    <textarea id="txtCipherTextCharacterSet">ABCDEFGHIJKLMNOPQRSTUVWXYZ</textarea>
                    <abbr title="Use space to create a second set of character on which the shift gets applied independently.">(?)</abbr>
                </div>
            </div>
        </details>
        <div class="row">
            <div class="label">Plaintext:</div>
            <div>
                <textarea id="txtPlaintext"></textarea>
            </div>
        </div>
        <div class="row">
            <div class="label">Encrypted:</div>
            <div>
                <textarea id="txtCiphertext"></textarea>
            </div>
        </div>
    </div>
</body>
</html>
